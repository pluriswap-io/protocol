# Wake config (CI job `wake`). Detections report on src/ only: mocks/ holds every test double, and the scripts
# that deploy it refuse to run off a test chain. Reviewed detections are suppressed in the code, next to each line.

[compiler.solc]
exclude_paths = ["lib", "script", "test", "mocks", "verifiers", "circuits", "node_modules"]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
    "poseidon-solidity/=lib/poseidon-solidity/contracts/",
    "erc4626-tests/=lib/openzeppelin-contracts/lib/erc4626-tests/",
    "halmos-cheatcodes/=lib/openzeppelin-contracts/lib/halmos-cheatcodes/src/",
    "openzeppelin-contracts/=lib/openzeppelin-contracts/",
]
evm_version = "cancun"
via_IR = true
target_version = "0.8.28"

[compiler.solc.optimizer]
enabled = true
runs = 200

[compiler.solc.metadata]
append_CBOR = true
use_literal_content = false
bytecode_hash = "ipfs"

[detectors]
exclude = []
ignore_paths = ["lib", "script", "test", "mocks"]
exclude_paths = ["lib", "script", "test", "mocks", "verifiers", "circuits", "node_modules"]

[testing]
cmd = "anvil"

[testing.anvil]
cmd_args = "--prune-history 100 --transaction-block-keeper 10 --steps-tracing --silent"

[testing.ganache]
cmd_args = "-k istanbul -q"

[testing.hardhat]
cmd_args = ""