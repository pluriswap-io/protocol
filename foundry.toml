[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200
ffi = false
fs_permissions = [
    { access = "read-write", path = "./deployments" },
    { access = "read", path = "./test/fixtures" },
]

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
    "poseidon-solidity/=lib/poseidon-solidity/contracts/",
]

[fuzz]
runs = 256

# Handlers guard their own preconditions; any revert inside a handler call is a bug.
[invariant]
runs = 32
depth = 256
fail_on_revert = true
call_override = false

[profile.ci.fuzz]
runs = 2048

[profile.ci.invariant]
runs = 128
depth = 512

[rpc_endpoints]
arbitrum_sepolia = "https://sepolia-rollup.arbitrum.io/rpc"
